<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Rune-amabot</title>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1 data-text="Rune-amabot">Rune-amabot</h1>
    </header>

    <main>
      <section class="chat" aria-label="Chatbot">
        <div class="chat-toolbar">
          <button
            type="button"
            id="clear-messages-button"
            class="icon-btn"
            aria-label="Ny chat"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>

        <!-- Beskedhistorik -->
        <div
          id="messages"
          class="messages"
          role="log"
          aria-live="polite"
          aria-label="Chat historik"
        ></div>

        <!-- Input-område -->
        <form class="chat-input" id="question-form">
          <label for="question">Skriv din besked</label>
          <input
            id="question"
            name="question"
            type="text"
            placeholder="Skriv en besked..."
            required
            maxlength="280"
          />
          <span id="char-counter" class="char-counter">0/280</span>
          <button type="submit" id="send-btn" aria-label="Send">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="19" x2="12" y2="5" />
              <polyline points="5 12 12 5 19 12" />
            </svg>
          </button>
        </form>
      </section>
    </main>

    <footer>
      <p>Lavet af Rune</p>
    </footer>
  </body>
</html>
